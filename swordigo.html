<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini Swordigo</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { background:#111; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:8px; overflow-x:hidden; }
  h1 { margin:6px 0; font-size:22px; }
  #wrap { position:relative; width:100%; max-width:800px; margin:0 auto; }
  canvas { background:#87ceeb; border:3px solid tomato; width:100%; height:auto; display:block; box-sizing:border-box; touch-action:none; }
  #mute { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.45); color:#fff; border:0; border-radius:8px; font-size:20px; padding:4px 10px; cursor:pointer; }
  #pad { display:none; justify-content:space-between; align-items:center; max-width:800px; margin:10px auto 0; padding:0 8px; user-select:none; -webkit-user-select:none; touch-action:none; }
  @media (pointer:coarse) { #pad { display:flex; } }
  .grp { display:flex; gap:14px; }
  .btn { width:78px; height:78px; border-radius:50%; border:3px solid rgba(255,255,255,0.6); background:rgba(255,255,255,0.15); color:#fff; font-size:30px; display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none; -webkit-user-select:none; }
  .btn.on { background:rgba(255,99,71,0.6); }
  #help { font-size:13px; color:#aaa; margin-top:8px; }
</style>
</head>
<body>
<h1>Mini Swordigo</h1>
<div id="wrap">
  <canvas id="c" width="800" height="400"></canvas>
  <button id="mute" title="Mute / Unmute (M)">🔊</button>
</div>

<div id="pad">
  <div class="grp">
    <div class="btn" data-key="ArrowLeft">◀</div>
    <div class="btn" data-key="ArrowRight">▶</div>
  </div>
  <div class="grp">
    <div class="btn" data-key="ArrowUp">⤒</div>
    <div class="btn" data-key=" ">⚔</div>
  </div>
</div>
<div id="help">Keys: ← → / A D chalo, ↑ / W jump, Space attack, M mute</div>

<script>
const canvas = document.getElementById("c");
const c = canvas.getContext("2d");

/* ===================== INPUT ===================== */
const keys = {};
const keyMap = { a:"ArrowLeft", A:"ArrowLeft", d:"ArrowRight", D:"ArrowRight", w:"ArrowUp", W:"ArrowUp" };
const blockKeys = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "];

document.addEventListener("keydown", e => {
    let k = keyMap[e.key] || e.key;
    if (blockKeys.includes(k)) e.preventDefault();
    if (k === "m" || k === "M") toggleMute();
    initAudio();
    keys[k] = true;
});
document.addEventListener("keyup", e => {
    let k = keyMap[e.key] || e.key;
    keys[k] = false;
});

// Touch / pointer buttons
document.querySelectorAll("#pad .btn").forEach(b => {
    const k = b.dataset.key;
    const press = e => { e.preventDefault(); initAudio(); keys[k] = true; b.classList.add("on"); };
    const release = e => { e.preventDefault(); keys[k] = false; b.classList.remove("on"); };
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", release);
    b.addEventListener("pointercancel", release);
    b.addEventListener("pointerleave", release);
    b.addEventListener("contextmenu", e => e.preventDefault());
});
// Canvas pe tap karne se bhi audio unlock ho jaye
canvas.addEventListener("pointerdown", initAudio);
document.addEventListener("contextmenu", e => { if (e.target.closest("#pad")) e.preventDefault(); });

/* ===================== AUDIO (WebAudio) ===================== */
let ac = null, muted = false, master = null;

function initAudio() {
    if (!ac) {
        try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
            master = ac.createGain();
            master.gain.value = 0.7;
            master.connect(ac.destination);
        } catch (e) { ac = null; }
    }
    if (ac && ac.state === "suspended") ac.resume();
}

function toggleMute() {
    muted = !muted;
    document.getElementById("mute").textContent = muted ? "🔇" : "🔊";
}
document.getElementById("mute").addEventListener("click", () => { initAudio(); toggleMute(); });

function tone(freq, dur, type = "square", vol = 0.08, slideTo = 0, delay = 0) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur);
}

function noise(dur, vol = 0.1, freq = 1500, delay = 0) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.setValueAtTime(freq, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(200, freq / 3), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
}

const sfx = {
    jump()   { tone(300, 0.18, "square", 0.07, 700); },
    swing()  { noise(0.14, 0.12, 3000); },
    hit()    { tone(220, 0.12, "sawtooth", 0.09, 90); noise(0.08, 0.1, 1200); },
    kill()   { tone(400, 0.25, "sawtooth", 0.09, 60); noise(0.2, 0.12, 900); },
    coin()   { tone(988, 0.07, "square", 0.06); tone(1319, 0.14, "square", 0.06, 0, 0.07); },
    hurt()   { tone(180, 0.3, "sawtooth", 0.12, 50); },
    lose()   { tone(330, 0.2, "triangle", 0.12); tone(262, 0.2, "triangle", 0.12, 0, 0.2); tone(196, 0.45, "triangle", 0.12, 0, 0.4); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, "square", 0.08, 0, i * 0.15)); }
};

/* ===================== WORLD ===================== */
const plats = [
    {x:0,y:360,w:2400,h:40},
    {x:150,y:290,w:120,h:15},
    {x:350,y:230,w:120,h:15},
    {x:560,y:290,w:140,h:15},
    {x:800,y:300,w:120,h:15},
    {x:1000,y:240,w:140,h:15},
    {x:1250,y:300,w:140,h:15},
    {x:1500,y:250,w:120,h:15}
];

let p = {x:50,y:300,w:24,h:36,vx:0,vy:0,ground:false};

function makeEnemies() {
    return [
        {x:400,y:324,w:28,h:36,dir:1,a:300,b:700,hp:2},
        {x:580,y:254,w:28,h:36,dir:1,a:560,b:672,hp:2},
        {x:1100,y:324,w:28,h:36,dir:1,a:1000,b:1400,hp:2},
        {x:800,y:264,w:28,h:36,dir:1,a:800,b:892,hp:2},
        {x:1700,y:324,w:28,h:36,dir:1,a:1600,b:2100,hp:2}
    ];
}
function makeCoins() {
    return [
        {x:200,y:260},{x:400,y:200},
        {x:610,y:260},{x:300,y:330},
        {x:860,y:270},{x:1060,y:210},
        {x:1320,y:270},{x:1560,y:220},
        {x:2000,y:330}
    ];
}

let enemies = makeEnemies();
let coins = makeCoins();
let hp = 5, atk = 0, inv = 0, face = 1;
let score = 0, camX = 0, t = 0, shake = 0, parts = [];
let won = false;

function burst(x, y) {
    for (let i = 0; i < 12; i++) {
        parts.push({x:x, y:y, vx:(Math.random()-0.5)*6, vy:-Math.random()*4, life:30});
    }
}

function reset() {
    p.x = 50; p.y = 300; p.vx = 0; p.vy = 0;
    hp = 5; inv = 0; atk = 0; face = 1;
    score = 0; camX = 0; shake = 0;
    parts = [];
    won = false;
    enemies = makeEnemies();
    coins = makeCoins();
}

/* ===================== UPDATE ===================== */
function update() {
    p.vx = 0;
    if (atk > 0) atk--;
    if (inv > 0) inv--;
    if (keys.ArrowLeft)  { p.vx = -3; face = -1; }
    if (keys.ArrowRight) { p.vx = 3;  face = 1; }
    if (keys.ArrowUp && p.ground) { p.vy = -11; sfx.jump(); }

    if (keys[" "] && atk == 0) {
        atk = 12;
        sfx.swing();
        const s = {x: face == 1 ? p.x + p.w : p.x - 30, y: p.y + 8, w: 30, h: 16};
        enemies.forEach(e => {
            if (s.x < e.x+e.w && s.x+s.w > e.x && s.y < e.y+e.h && s.y+s.h > e.y) {
                e.hp--;
                e.x += face * 30;
                burst(e.x + 14, e.y + 18);
                if (e.hp > 0) sfx.hit(); else sfx.kill();
            }
        });
        enemies = enemies.filter(e => e.hp > 0);
    }

    coins = coins.filter(k => {
        const hitCoin = p.x < k.x+8 && p.x+p.w > k.x-8 && p.y < k.y+8 && p.y+p.h > k.y-8;
        if (hitCoin) { score++; sfx.coin(); }
        return !hitCoin;
    });

    parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.vy += 0.2; q.life--; });
    parts = parts.filter(q => q.life > 0);

    if (p.x < 0) p.x = 0;
    if (p.x > 2376) p.x = 2376;
    camX = p.x - 400;
    if (camX < 0) camX = 0;
    if (camX > 1600) camX = 1600;

    p.vy += 0.5;
    p.x += p.vx;
    p.y += p.vy;
    p.ground = false;

    plats.forEach(q => {
        const oldBottom = p.y + p.h - p.vy;
        if (p.x+p.w > q.x && p.x < q.x+q.w && p.vy >= 0 &&
            oldBottom <= q.y + 1 && p.y+p.h >= q.y) {
            p.y = q.y - p.h;
            p.vy = 0;
            p.ground = true;
        }
    });

    enemies.forEach(e => {
        e.x += e.dir;
        if (e.x < e.a || e.x > e.b) e.dir *= -1;
        if (p.x < e.x+e.w && p.x+p.w > e.x && p.y < e.y+e.h && p.y+p.h > e.y && inv == 0) {
            hp--; inv = 60; shake = 10;
            p.vy = -5;
            sfx.hurt();
        }
    });

    if (enemies.length == 0 && !won) { won = true; sfx.win(); }

    if (hp <= 0 || p.y > 420) { sfx.lose(); reset(); }
}

/* ===================== DRAW ===================== */
function circle(x, y, r, color) {
    c.fillStyle = color;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI*2);
    c.fill();
}

function mountains(speed, base, h, w, color) {
    c.fillStyle = color;
    const off = -(camX*speed) % w;
    for (let x = off - w; x < 800; x += w) {
        c.beginPath();
        c.moveTo(x, base);
        c.lineTo(x + w/2, base - h);
        c.lineTo(x + w, base);
        c.closePath();
        c.fill();
    }
}

function clouds() {
    for (let i = 0; i < 4; i++) {
        const x = ((i*300 - camX*0.15) % 1200 + 1200) % 1200 - 200;
        const y = 50 + (i%3)*35;
        circle(x, y, 22, "rgba(255,255,255,0.85)");
        circle(x+24, y+6, 18, "rgba(255,255,255,0.85)");
        circle(x-22, y+6, 16, "rgba(255,255,255,0.85)");
    }
}

function draw() {
    c.clearRect(0, 0, 800, 400);
    clouds();
    mountains(0.2, 360, 170, 320, "#6a8caf");
    mountains(0.5, 360, 100, 120, "#4f7a5a");
    t++;
    const step = p.vx != 0 ? Math.sin(t * 0.3) * 4 : 0;

    c.save();
    c.translate(-camX, 0);
    if (shake > 0) {
        c.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        shake--;
    }

    // platforms
    c.fillStyle = "#4a3";
    plats.forEach(q => c.fillRect(q.x, q.y, q.w, q.h));

    // coins
    coins.forEach(k => circle(k.x, k.y, 8, "gold"));

    // player (hurt hone par blink)
    if (!(inv > 0 && Math.floor(t / 4) % 2 == 0)) {
        c.fillStyle = "#2a4bd7";                 // body
        c.fillRect(p.x+4, p.y+14, 16, 18);
        circle(p.x+12, p.y+8, 8, "#ffcc99");     // sir
        c.fillStyle = "#5a3a1a";                 // baal / topi
        c.fillRect(p.x+4, p.y, 16, 5);
        circle(p.x+12+face*3, p.y+8, 1.5, "#000"); // aankh
        c.fillStyle = "#222";                    // pair
        c.fillRect(p.x+4+step, p.y+32, 6, 4);
        c.fillRect(p.x+14-step, p.y+32, 6, 4);
    }

    // enemies
    enemies.forEach(e => {
        circle(e.x+14, e.y+20, 14, "#c0392b");
        circle(e.x+8,  e.y+16, 3, "#fff");
        circle(e.x+20, e.y+16, 3, "#fff");
        circle(e.x+8,  e.y+16, 1.2, "#000");
        circle(e.x+20, e.y+16, 1.2, "#000");
        c.fillStyle = "#000";
        c.fillRect(e.x+17, e.y+10, 6, 2);
    });

    // particles
    c.fillStyle = "orange";
    parts.forEach(q => c.fillRect(q.x, q.y, 3, 3));

    // sword swing
    if (atk > 0) {
        const ang = (12 - atk)/12*1.6 - 0.8;
        c.save();
        c.translate(p.x+12, p.y+20);
        c.scale(face, 1);
        c.rotate(ang);
        c.fillStyle = "silver";
        c.fillRect(0, -2, 32, 4);
        c.fillStyle = "#8b5a2b";
        c.fillRect(-4, -3, 8, 6);
        c.restore();
    }
    c.restore();

    // HUD (screen space)
    c.fillStyle = "#000";
    c.font = "20px Arial";
    c.textAlign = "left";
    c.fillText("HP: " + hp, 10, 25);
    c.fillText("Coins: " + score, 10, 50);

    if (won) {
        c.textAlign = "center";
        c.font = "bold 36px Arial";
        c.fillStyle = "#fff";
        c.strokeStyle = "#000";
        c.lineWidth = 4;
        c.strokeText("Jeet gaya! 🎉", 400, 120);
        c.fillText("Jeet gaya! 🎉", 400, 120);
        c.textAlign = "left";
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
