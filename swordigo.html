<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini Swordigo</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { background:#111; color:#fff; font-family:Arial, sans-serif; text-align:center; margin:0; padding:8px; overflow-x:hidden; }
  h1 { margin:6px 0; font-size:22px; }
  #wrap { position:relative; width:100%; max-width:800px; margin:0 auto; }
  canvas { background:#87ceeb; border:3px solid tomato; width:100%; height:auto; display:block; box-sizing:border-box; touch-action:none; }
  #mute { position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.45); color:#fff; border:0; border-radius:8px; font-size:20px; padding:4px 10px; cursor:pointer; }
  #pad { display:none; justify-content:space-between; align-items:center; max-width:800px; margin:10px auto 0; padding:0 8px; user-select:none; -webkit-user-select:none; touch-action:none; }
  @media (pointer:coarse) { #pad { display:flex; } }
  .grp { display:flex; gap:14px; }
  .btn { width:78px; height:78px; border-radius:50%; border:3px solid rgba(255,255,255,0.6); background:rgba(255,255,255,0.15); color:#fff; font-size:30px; display:flex; align-items:center; justify-content:center; touch-action:none; user-select:none; -webkit-user-select:none; }
  .btn.on { background:rgba(255,99,71,0.6); }
  #help { font-size:13px; color:#aaa; margin-top:8px; }
</style>
</head>
<body>
<h1>Mini Swordigo</h1>
<div id="wrap">
  <canvas id="c" width="800" height="400"></canvas>
  <button id="mute" title="Mute / Unmute (M)">🔊</button>
</div>

<div id="pad">
  <div class="grp">
    <div class="btn" data-key="ArrowLeft">◀</div>
    <div class="btn" data-key="ArrowRight">▶</div>
  </div>
  <div class="grp">
    <div class="btn" data-key="ArrowUp">⤒</div>
    <div class="btn" data-key=" ">⚔</div>
  </div>
</div>
<div id="help">Keys: ← → / A D move, ↑ / W jump, Space attack, M mute. Defeat all enemies, then enter the portal!</div>

<script>
const canvas = document.getElementById("c");
const c = canvas.getContext("2d");

/* ===================== INPUT ===================== */
const keys = {};
const keyMap = { a:"ArrowLeft", A:"ArrowLeft", d:"ArrowRight", D:"ArrowRight", w:"ArrowUp", W:"ArrowUp" };
const blockKeys = ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "];

document.addEventListener("keydown", e => {
    let k = keyMap[e.key] || e.key;
    if (blockKeys.includes(k)) e.preventDefault();
    if (k === "m" || k === "M") toggleMute();
    initAudio();
    keys[k] = true;
});
document.addEventListener("keyup", e => {
    let k = keyMap[e.key] || e.key;
    keys[k] = false;
});

document.querySelectorAll("#pad .btn").forEach(b => {
    const k = b.dataset.key;
    const press = e => { e.preventDefault(); initAudio(); keys[k] = true; b.classList.add("on"); };
    const release = e => { e.preventDefault(); keys[k] = false; b.classList.remove("on"); };
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", release);
    b.addEventListener("pointercancel", release);
    b.addEventListener("pointerleave", release);
    b.addEventListener("contextmenu", e => e.preventDefault());
});
canvas.addEventListener("pointerdown", () => {
    initAudio();
    if (state === "win" && winReady) restartGame();
    if (state === "cutscene" && cutT > 60 && cutT < 340) cutT = 340;
});
document.addEventListener("contextmenu", e => { if (e.target.closest("#pad")) e.preventDefault(); });

/* ===================== AUDIO (WebAudio) ===================== */
let ac = null, muted = false, master = null;

function initAudio() {
    if (!ac) {
        try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
            master = ac.createGain();
            master.gain.value = 0.7;
            master.connect(ac.destination);
        } catch (e) { ac = null; }
    }
    if (ac && ac.state === "suspended") ac.resume();
}

function toggleMute() {
    muted = !muted;
    document.getElementById("mute").textContent = muted ? "🔇" : "🔊";
}
document.getElementById("mute").addEventListener("click", () => { initAudio(); toggleMute(); });

function tone(freq, dur, type = "square", vol = 0.08, slideTo = 0, delay = 0) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur);
}

function noise(dur, vol = 0.1, freq = 1500, delay = 0) {
    if (!ac || muted) return;
    const t0 = ac.currentTime + delay;
    const len = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.setValueAtTime(freq, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(200, freq / 3), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
}

const sfx = {
    jump()   { tone(300, 0.18, "square", 0.07, 700); },
    swing()  { noise(0.14, 0.12, 3000); },
    hit()    { tone(220, 0.12, "sawtooth", 0.09, 90); noise(0.08, 0.1, 1200); },
    kill()   { tone(400, 0.25, "sawtooth", 0.09, 60); noise(0.2, 0.12, 900); },
    coin()   { tone(988, 0.07, "square", 0.06); tone(1319, 0.14, "square", 0.06, 0, 0.07); },
    hurt()   { tone(180, 0.3, "sawtooth", 0.12, 50); },
    lose()   { tone(330, 0.2, "triangle", 0.12); tone(262, 0.2, "triangle", 0.12, 0, 0.2); tone(196, 0.45, "triangle", 0.12, 0, 0.4); },
    win()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, "square", 0.08, 0, i * 0.15)); },
    open()   { tone(500, 0.15, "triangle", 0.1, 900); tone(900, 0.25, "triangle", 0.1, 1400, 0.12); },
    portal() { tone(300, 0.5, "sine", 0.12, 1400); tone(600, 0.5, "triangle", 0.06, 1800, 0.1); },
    shoot()  { tone(700, 0.1, "triangle", 0.05, 300); },
    rumble() { noise(0.4, 0.15, 200); tone(60, 0.4, "sawtooth", 0.1, 40); },
    roar()   { tone(120, 0.9, "sawtooth", 0.14, 50); tone(90, 0.9, "square", 0.08, 40, 0.05); noise(0.7, 0.12, 500); },
    slam()   { noise(0.3, 0.2, 300); tone(80, 0.3, "sine", 0.18, 40); }
};

/* ===================== GAME STATE ===================== */
const MAXHP = 5;
let levelIndex = 0;
let level = LEVELS[0];
let plats = [], enemies = [], coins = [];
let p = {x:50,y:300,w:24,h:36,vx:0,vy:0,ground:false};
let hp = MAXHP, atk = 0, inv = 0, face = 1;
let score = 0, scoreAtStart = 0;
let camX = 0, t = 0, shake = 0, parts = [];
let state = "play";        // "play" | "fadeOut" | "fadeIn" | "win"
let fade = 0;              // 0 = clear, 1 = black
let bannerTimer = 0;
let portalWasOpen = false;
let winReady = false;
let boss = null;
let hazards = [];          // arrows, shockwaves, falling rocks
let cutT = 0, cutReady = false, introSeen = false;

const ENEMY_TYPES = {
    slime:  { w:28, h:36, hp:2, sp:1 },
    bat:    { w:28, h:20, hp:1, sp:1.8, fly:true },
    archer: { w:24, h:36, hp:2, sp:0.4, shoots:true }
};
// Collision / overlap detection
function overlap(a, b) {
    return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
    );
}

function hurtPlayer(d) {
    hp -= d; inv = 60; shake = 10; p.vy = -5;
    sfx.hurt();
}

function loadLevel(i) {
    levelIndex = i;
    level = LEVELS[i];
    plats = level.plats;
    enemies = level.enemies.map(e => {
        const type = e.type || "slime";
        const base = ENEMY_TYPES[type];
        const isSlime = type === "slime";
        return {
            dir: 1, facing: 1, shootTimer: 60 + Math.random()*60,
            t0: Math.random()*6, baseY: e.y,
            ...base, type,
            hp: isSlime ? (level.enemyHp || base.hp) : base.hp,
            sp: isSlime ? (level.enemySpeed || base.sp) : base.sp,
            ...e
        };
    });
    coins = level.coins.map(k => ({...k}));
    boss = level.boss ? makeBoss() : null;
    hazards = [];
    p.x = 50; p.y = 324; p.vx = 0; p.vy = 0; p.ground = false;
    atk = 0; inv = 0; face = 1;
    parts = [];
    camX = 0;
    shake = 0;
    scoreAtStart = score;
    bannerTimer = level.boss ? 0 : 150;
    portalWasOpen = false;
}

// decides what happens right after a level loads (cutscene or normal play)
function beginLevel() {
    if (level.boss) {
        if (introSeen) {
            state = "play";
            boss.active = true; boss.eyesOn = true; boss.y = 360 - boss.h;
        } else {
            state = "cutscene"; cutT = 0; cutReady = false;
        }
    } else {
        state = "play";
    }
}

function restartLevel() {         // after dying
    sfx.lose();
    hp = MAXHP;
    score = scoreAtStart;
    loadLevel(levelIndex);
    beginLevel();
}

function restartGame() {          // after finishing the game
    score = 0;
    hp = MAXHP;
    fade = 0;
    introSeen = false;
    loadLevel(0);
    beginLevel();
}

function advanceLevel() {
    if (levelIndex + 1 < LEVELS.length) {
        hp = Math.min(MAXHP, hp + 1);
        loadLevel(levelIndex + 1);
        state = "fadeIn";
        fade = 1;
    } else {
        state = "win";
        winReady = false;
        sfx.win();
    }
}

function portalOpen() {
    return !level.lockedUntilClear || (enemies.length === 0 && !boss);
}

/* ---------- BOSS ---------- */
function makeBoss() {
    return { x:580, y:400, w:90, h:100, hp:30, maxHp:30, dir:-1,
             active:false, eyesOn:false, enraged:false,
             state:"idle", timer:90, vy:0, flash:0 };
}

function damageBoss() {
    boss.hp -= 1;
    boss.flash = 6;
    burst(boss.x + boss.w/2, boss.y + 40);
    sfx.hit();
    if (boss.hp <= 0) {
        boss.state = "dying"; boss.timer = 90;
        hazards = [];
        sfx.roar();
    }
}

function updateBoss() {
    const b = boss;
    if (!b.active) return;
    if (b.flash > 0) b.flash--;
    const gy = 360 - b.h;

    if (b.state === "dying") {
        shake = 6;
        if (b.timer % 6 === 0) burst(b.x + Math.random()*b.w, b.y + Math.random()*b.h);
        if (--b.timer <= 0) {
            sfx.kill(); shake = 30;
            for (let i = 0; i < 8; i++) burst(b.x + Math.random()*b.w, b.y + Math.random()*b.h);
            score += 10;
            boss = null;
        }
        return;
    }

    // phase 2 at half health
    if (!b.enraged && b.hp <= b.maxHp / 2) {
        b.enraged = true; sfx.roar(); shake = 25;
        b.state = "idle"; b.timer = 60; b.vy = 0; b.y = gy;
    }

    const fast = b.enraged ? 1.15 : 0.75;
    const pc = p.x + p.w/2, bc = b.x + b.w/2;
    b.timer--;

    if (b.state === "idle") {
        b.dir = pc < bc ? -1 : 1;
        b.x += b.dir * 0.8 * fast;
        if (b.timer <= 0) {
            const r = Math.random();
            if (b.enraged && r < 0.3)  { b.state = "rocks";  b.timer = 140; }
            else if (r < 0.65)         { b.state = "windup"; b.timer = 40; }
            else                       { b.state = "jump";   b.vy = -13; }
        }
    }
    else if (b.state === "windup") {            // shakes and glows = warning!
        b.dir = pc < bc ? -1 : 1;
        if (b.timer <= 0) { b.state = "charge"; b.timer = 80; }
    }
    else if (b.state === "charge") {
        b.x += b.dir * 3.5 * fast;
        const wall = b.x <= 0 || b.x + b.w >= level.width;
        if (wall || b.timer <= 0) {
            if (wall) { shake = 15; sfx.slam(); }
            b.state = "idle"; b.timer = 70;
        }
    }
    else if (b.state === "jump") {
        b.vy += 0.6;
        b.y += b.vy;
        b.x += (pc < bc ? -1 : 1) * 2.5;
        if (b.vy > 0 && b.y >= gy) {
            b.y = gy; b.vy = 0;
            shake = 20; sfx.slam();
            const cx = b.x + b.w/2 - 12;
            hazards.push({kind:"wave", x:cx, y:340, w:24, h:20, vx:-4*fast, vy:0, g:0, life:140});
            hazards.push({kind:"wave", x:cx, y:340, w:24, h:20, vx: 4*fast, vy:0, g:0, life:140});
            b.state = "idle"; b.timer = 70;
        }
    }
    else if (b.state === "rocks") {             // phase 2 only
        if (b.timer % 20 === 0) {
            const rx = Math.max(10, Math.min(770, pc + (Math.random()-0.5)*160));
            hazards.push({kind:"rock", x:rx, y:-20, w:22, h:22, vx:0, vy:0, g:0.3, life:300});
        }
        if (b.timer <= 0) { b.state = "idle"; b.timer = 60; }
    }

    b.x = Math.max(0, Math.min(level.width - b.w, b.x));

    if (inv == 0 && overlap(p, b)) hurtPlayer(1);   // touching the golem hurts
}

/* ---------- ARROWS / SHOCKWAVES / ROCKS ---------- */
function updateHazards() {
    hazards = hazards.filter(h => {
        h.x += h.vx; h.vy += h.g; h.y += h.vy; h.life--;
        if (h.life <= 0 || h.x < -60 || h.x > level.width + 60 || h.y > 400) return false;
        if (h.kind === "rock" && h.y + h.h >= 360) { burst(h.x + h.w/2, 355); return false; }
        if (h.kind === "arrow" && plats.some(q => overlap(h, q))) return false;
        if (inv == 0 && overlap(p, h)) { hurtPlayer(1); return false; }
        return true;
    });
}

function updateParts() {
    parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.vy += 0.2; q.life--; });
    parts = parts.filter(q => q.life > 0);
}

/* ---------- CUTSCENE ---------- */
function updateCutscene() {
    cutT++;
    const b = boss;
    if (!keys[" "]) cutReady = true;
    if (cutReady && keys[" "] && cutT > 60 && cutT < 340) cutT = 340;   // skip

    if (cutT <= 200) {
        if (cutT > 50) {                              // golem rises from the ground
            const k = (cutT - 50) / 150;
            b.y = 400 - (400 - (360 - b.h)) * k;
            shake = 6;
            if (cutT % 6 === 0)  burst(b.x + Math.random()*b.w, 360);
            if (cutT % 30 === 0) sfx.rumble();
        }
    } else {
        b.y = 360 - b.h;
    }
    if (cutT === 210) { sfx.roar(); shake = 25; }
    b.eyesOn = cutT >= 210;

    updateParts();
    if (cutT >= 380) { state = "play"; b.active = true; introSeen = true; }
}

function burst(x, y) {
    for (let i = 0; i < 12; i++) {
        parts.push({x:x, y:y, vx:(Math.random()-0.5)*6, vy:-Math.random()*4, life:30});
    }
}

/* ===================== UPDATE ===================== */
function update() {
    if (state === "win") {
        if (!keys[" "]) winReady = true;
        else if (winReady) restartGame();
        return;
    }
    if (state === "fadeOut") {
        fade += 0.03;
        if (fade >= 1) { fade = 1; advanceLevel(); }
        return;
    }
    if (state === "cutscene") { updateCutscene(); return; }
    if (state === "fadeIn") {
        fade -= 0.03;
        if (fade <= 0) { fade = 0; beginLevel(); }
        if (level.boss) return;
    }
    if (bannerTimer > 0) bannerTimer--;

    p.vx = 0;
    if (atk > 0) atk--;
    if (inv > 0) inv--;
    if (keys.ArrowLeft)  { p.vx = -3; face = -1; }
    if (keys.ArrowRight) { p.vx = 3;  face = 1; }
    if (keys.ArrowUp && p.ground) { p.vy = -11; sfx.jump(); }

    if (keys[" "] && atk == 0) {
        atk = 12;
        sfx.swing();
        const s = {x: face == 1 ? p.x + p.w : p.x - 30, y: p.y + 8, w: 30, h: 16};
        enemies.forEach(e => {
            if (overlap(s, e)) {
                e.hp--;
                e.x += face * 30;
                burst(e.x + e.w/2, e.y + 18);
                if (e.hp > 0) sfx.hit(); else sfx.kill();
            }
        });
        enemies = enemies.filter(e => e.hp > 0);
        if (boss && boss.active && boss.state !== "dying" && overlap(s, boss)) damageBoss();
    }

    coins = coins.filter(k => {
        const hitCoin = p.x < k.x+8 && p.x+p.w > k.x-8 && p.y < k.y+8 && p.y+p.h > k.y-8;
        if (hitCoin) { score++; sfx.coin(); }
        return !hitCoin;
    });

    updateParts();

    if (p.x < 0) p.x = 0;
    if (p.x > level.width - p.w) p.x = level.width - p.w;
    camX = p.x - 400;
    if (camX < 0) camX = 0;
    if (camX > level.width - 800) camX = level.width - 800;

    p.vy += 0.5;
    p.x += p.vx;
    p.y += p.vy;
    p.ground = false;

    plats.forEach(q => {
        const oldBottom = p.y + p.h - p.vy;
        if (p.x+p.w > q.x && p.x < q.x+q.w && p.vy >= 0 &&
            oldBottom <= q.y + 1 && p.y+p.h >= q.y) {
            p.y = q.y - p.h;
            p.vy = 0;
            p.ground = true;
        }
    });

    enemies.forEach(e => {
        e.x += e.dir * e.sp;
        if (e.fly) e.y = e.baseY + Math.sin(t * 0.08 + e.t0) * 25;   // bat wave
        if (e.x < e.a) { e.x = e.a; e.dir = 1; }
        else if (e.x > e.b) { e.x = e.b; e.dir = -1; }

        if (e.shoots) {                                              // archer
            e.facing = p.x < e.x ? -1 : 1;
            e.shootTimer--;
            if (e.shootTimer <= 0 && Math.abs(p.x - e.x) < 450 && Math.abs(p.y - e.y) < 140) {
                e.shootTimer = 110;
                hazards.push({kind:"arrow", x:e.x + e.w/2, y:e.y + 14, w:16, h:4,
                              vx:e.facing * 5, vy:0, g:0, life:120});
                sfx.shoot();
            }
        }
        if (inv == 0 && overlap(p, e)) hurtPlayer(1);
    });

    if (boss) updateBoss();
    updateHazards();

    const open = portalOpen();
    if (open && !portalWasOpen && level.lockedUntilClear) sfx.open();
    portalWasOpen = open;

    const ex = level.exit;
    if (open && state === "play" &&
        p.x < ex.x+40 && p.x+p.w > ex.x && p.y < ex.y+70 && p.y+p.h > ex.y) {
        sfx.portal();
        state = "fadeOut";
        fade = 0;
        return;
    }

    if (hp <= 0 || p.y > 420) restartLevel();
}

/* ===================== DRAW ===================== */
function circle(x, y, r, color) {
    c.fillStyle = color;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI*2);
    c.fill();
}

function mountains(speed, base, h, w, color) {
    c.fillStyle = color;
    const off = -(camX*speed) % w;
    for (let x = off - w; x < 800; x += w) {
        c.beginPath();
        c.moveTo(x, base);
        c.lineTo(x + w/2, base - h);
        c.lineTo(x + w, base);
        c.closePath();
        c.fill();
    }
}

function clouds() {
    for (let i = 0; i < 4; i++) {
        const x = ((i*300 - camX*0.15) % 1200 + 1200) % 1200 - 200;
        const y = 50 + (i%3)*35;
        circle(x, y, 22, "rgba(255,255,255,0.85)");
        circle(x+24, y+6, 18, "rgba(255,255,255,0.85)");
        circle(x-22, y+6, 16, "rgba(255,255,255,0.85)");
    }
}

function drawPortal() {
    const e = level.exit;
    const cx = e.x + 20, cy = e.y + 35;
    const open = portalOpen();
    c.save();
    if (open) { c.shadowColor = "#b46bff"; c.shadowBlur = 25; }
    for (let i = 0; i < 4; i++) {
        const pulse = open ? Math.sin(t * 0.1 + i) * 2 : 0;
        c.strokeStyle = open ? (i % 2 ? "#6be3ff" : "#b46bff") : "#777";
        c.lineWidth = 3;
        c.beginPath();
        c.ellipse(cx, cy, 20 - i*4 + pulse, 35 - i*7 + pulse, 0, 0, Math.PI*2);
        c.stroke();
    }
    c.restore();
    if (open) {
        for (let i = 0; i < 6; i++) {
            const a = t * 0.05 + i * (Math.PI*2/6);
            circle(cx + Math.cos(a)*26, cy + Math.sin(a)*40, 2, "#fff");
        }
    } else {
        c.fillStyle = "#555";
        c.font = "12px Arial";
        c.textAlign = "center";
        c.fillText("LOCKED", cx, e.y - 8);
        c.textAlign = "left";
    }
}

function drawSlime(e) {
    circle(e.x+14, e.y+20, 14, "#c0392b");
    circle(e.x+8,  e.y+16, 3, "#fff");
    circle(e.x+20, e.y+16, 3, "#fff");
    circle(e.x+8,  e.y+16, 1.2, "#000");
    circle(e.x+20, e.y+16, 1.2, "#000");
    c.fillStyle = "#000";
    c.fillRect(e.x+17, e.y+10, 6, 2);
}

function drawBat(e) {
    const cx = e.x + e.w/2, cy = e.y + e.h/2;
    const flap = Math.sin(t * 0.4 + e.t0) * 10;
    c.fillStyle = "#4a235a";
    c.beginPath(); c.moveTo(cx-4, cy); c.lineTo(cx-24, cy-8+flap); c.lineTo(cx-16, cy+6); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(cx+4, cy); c.lineTo(cx+24, cy-8+flap); c.lineTo(cx+16, cy+6); c.closePath(); c.fill();
    circle(cx, cy, 9, "#6c3483");
    circle(cx-3, cy-2, 2, "#ff4d4d");
    circle(cx+3, cy-2, 2, "#ff4d4d");
}

function drawArcher(e) {
    const f = e.facing || 1;
    c.fillStyle = "#2e7d32";
    c.fillRect(e.x+4, e.y+14, 16, 22);
    circle(e.x+12, e.y+9, 8, "#ffcc99");
    c.fillStyle = "#1b5e20";
    c.fillRect(e.x+3, e.y, 18, 7);
    circle(e.x+12+f*3, e.y+9, 1.5, "#000");
    const bx = e.x + 12 + f*6, by = e.y + 22;       // bow
    c.strokeStyle = "#8b5a2b"; c.lineWidth = 3;
    c.beginPath();
    c.arc(bx, by, 12, f === 1 ? -1.2 : Math.PI-1.2, f === 1 ? 1.2 : Math.PI+1.2);
    c.stroke();
    c.strokeStyle = "#ddd"; c.lineWidth = 1;
    c.beginPath();
    c.moveTo(bx + f*4.3, by - 11); c.lineTo(bx + f*4.3, by + 11);
    c.stroke();
}

function drawBoss(b) {
    const sh = b.state === "windup" ? (Math.random()-0.5)*6 : 0;
    const x = b.x + sh, y = b.y;
    const stone = b.flash > 0 ? "#ffffff" : (b.enraged ? "#7a4a4a" : "#6e7378");
    const dark  = b.flash > 0 ? "#dddddd" : (b.enraged ? "#5a3030" : "#4d5156");
    c.fillStyle = dark;
    c.fillRect(x-14, y+28, 22, 52);                 // arms
    c.fillRect(x+b.w-8, y+28, 22, 52);
    c.fillRect(x+10, y+76, 24, 24);                 // legs
    c.fillRect(x+b.w-34, y+76, 24, 24);
    c.fillStyle = stone;
    c.fillRect(x, y+22, b.w, 60);                   // torso
    c.fillRect(x+20, y, b.w-40, 30);                // head
    c.strokeStyle = dark; c.lineWidth = 3;          // cracks
    c.beginPath(); c.moveTo(x+30, y+36); c.lineTo(x+40, y+56); c.lineTo(x+32, y+74); c.stroke();
    if (b.eyesOn) {
        const glow = (b.state === "windup" || b.enraged) ? "#ff3b1f" : "#ffb347";
        const eo = b.dir * 3;
        c.save();
        c.shadowColor = glow; c.shadowBlur = 14;
        c.fillStyle = glow;
        c.fillRect(x+30+eo, y+10, 10, 7);
        c.fillRect(x+b.w-40+eo, y+10, 10, 7);
        c.restore();
    }
}

function drawHazard(h) {
    if (h.kind === "arrow") {
        c.fillStyle = "#d8c8a0"; c.fillRect(h.x, h.y, h.w, h.h);
        c.fillStyle = "#888";    c.fillRect(h.vx > 0 ? h.x+h.w-4 : h.x, h.y-1, 4, 6);
    } else if (h.kind === "rock") {
        c.fillStyle = "#6e7378"; c.fillRect(h.x, h.y, h.w, h.h);
        c.fillStyle = "#4d5156"; c.fillRect(h.x+4, h.y+4, 8, 8);
    } else {                                         // shockwave
        c.fillStyle = "rgba(255,120,60,0.85)";
        c.beginPath();
        c.moveTo(h.x, h.y+h.h); c.lineTo(h.x+h.w/2, h.y); c.lineTo(h.x+h.w, h.y+h.h);
        c.closePath(); c.fill();
    }
}

function drawCutscene() {
    let bar = Math.min(cutT / 40, 1) * 60;                       // cinema bars
    if (cutT > 340) bar = Math.max(0, 1 - (cutT - 340) / 40) * 60;
    c.fillStyle = "#000";
    c.fillRect(0, 0, 800, bar);
    c.fillRect(0, 400 - bar, 800, bar);

    if (cutT > 260) {                                            // title card
        let a = Math.min(1, (cutT - 260) / 30);
        if (cutT > 340) a *= Math.max(0, 1 - (cutT - 340) / 40);
        c.globalAlpha = a;
        c.textAlign = "center";
        c.lineWidth = 6; c.strokeStyle = "#000";
        c.font = "bold 54px Georgia, serif";
        c.fillStyle = "#ff5a3c";
        c.strokeText("STONE GOLEM", 400, 200);
        c.fillText("STONE GOLEM", 400, 200);
        c.font = "italic 20px Georgia, serif";
        c.fillStyle = "#ddd";
        c.fillText("Guardian of the Lair", 400, 238);
        c.globalAlpha = 1;
        c.textAlign = "left";
    }
    if (cutT > 60 && cutT < 340) {
        c.font = "12px Arial"; c.fillStyle = "#888"; c.textAlign = "right";
        c.fillText("Space / tap to skip", 790, 388);
        c.textAlign = "left";
    }
}
//===================== DRAW ===================== */
function draw() {
    c.fillStyle = level.colors.sky;
    c.fillRect(0, 0, 800, 400);
    if (level.clouds !== false) clouds();
    mountains(0.2, 360, 170, 320, level.colors.far);
    mountains(0.5, 360, 100, 120, level.colors.near);
    t++;
    const step = p.vx != 0 ? Math.sin(t * 0.3) * 4 : 0;

    c.save();
    c.translate(-camX, 0);
    if (shake > 0) {
        c.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        shake--;
    }

    c.fillStyle = level.colors.plat;
    plats.forEach(q => c.fillRect(q.x, q.y, q.w, q.h));

    if (!(level.boss && boss)) drawPortal();     // portal appears after the boss dies

    coins.forEach(k => circle(k.x, k.y, 8, "gold"));

    if (!(inv > 0 && Math.floor(t / 4) % 2 == 0)) {
        c.fillStyle = "#2a4bd7";
        c.fillRect(p.x+4, p.y+14, 16, 18);
        circle(p.x+12, p.y+8, 8, "#ffcc99");
        c.fillStyle = "#5a3a1a";
        c.fillRect(p.x+4, p.y, 16, 5);
        circle(p.x+12+face*3, p.y+8, 1.5, "#000");
        c.fillStyle = "#222";
        c.fillRect(p.x+4+step, p.y+32, 6, 4);
        c.fillRect(p.x+14-step, p.y+32, 6, 4);
    }

    enemies.forEach(e => {
        if (e.type === "bat") drawBat(e);
        else if (e.type === "archer") drawArcher(e);
        else drawSlime(e);
    });
    if (boss) drawBoss(boss);
    hazards.forEach(drawHazard);

    c.fillStyle = "orange";
    parts.forEach(q => c.fillRect(q.x, q.y, 3, 3));

    if (atk > 0) {
        const ang = (12 - atk)/12*1.6 - 0.8;
        c.save();
        c.translate(p.x+12, p.y+20);
        c.scale(face, 1);
        c.rotate(ang);
        c.fillStyle = "silver";
        c.fillRect(0, -2, 32, 4);
        c.fillStyle = "#8b5a2b";
        c.fillRect(-4, -3, 8, 6);
        c.restore();
    }
    c.restore();

    // ---------- HUD ----------
    c.fillStyle = level.dark ? "#fff" : "#000";
    c.font = "20px Arial";
    c.textAlign = "left";
    c.fillText("HP: " + hp, 10, 25);
    c.fillText("Coins: " + score, 10, 50);
    c.textAlign = "center";
    c.font = "16px Arial";
    c.fillText("Level " + (levelIndex+1) + "/" + LEVELS.length + " - " + level.name, 400, 25);
    if (enemies.length > 0) c.fillText("Enemies left: " + enemies.length, 400, 48);
    else if (state === "play" && portalOpen()) c.fillText("Portal is open! Go!", 400, 48);

    // boss health bar
    if (boss && boss.active) {
        c.fillStyle = "#000";
        c.fillRect(198, 62, 404, 18);
        c.fillStyle = boss.enraged ? "#ff5a3c" : "#c0392b";
        c.fillRect(200, 64, 400 * Math.max(0, boss.hp) / boss.maxHp, 14);
        c.fillStyle = "#fff";
        c.font = "bold 12px Arial";
        c.fillText("STONE GOLEM", 400, 58);
    }

    if (bannerTimer > 0 && state !== "win") {
        c.globalAlpha = Math.min(1, bannerTimer / 40);
        c.font = "bold 34px Arial";
        c.lineWidth = 5;
        c.strokeStyle = "#000";
        c.fillStyle = "#fff";
        const title = "Level " + (levelIndex+1) + ": " + level.name;
        c.strokeText(title, 400, 160);
        c.fillText(title, 400, 160);
        c.font = "16px Arial";
        c.lineWidth = 3;
        c.strokeText("Defeat all enemies to open the portal", 400, 192);
        c.fillText("Defeat all enemies to open the portal", 400, 192);
        c.globalAlpha = 1;
    }
    c.textAlign = "left";

    if (fade > 0) {
        c.fillStyle = "rgba(0,0,0," + Math.min(1, fade) + ")";
        c.fillRect(0, 0, 800, 400);
    }

    if (state === "cutscene") drawCutscene();

    if (state === "win") {
        c.fillStyle = "rgba(0,0,0,0.85)";
        c.fillRect(0, 0, 800, 400);
        c.textAlign = "center";
        c.fillStyle = "gold";
        c.font = "bold 48px Arial";
        c.fillText("YOU WIN!", 400, 150);
        c.fillStyle = "#fff";
        c.font = "24px Arial";
        c.fillText("You cleared all " + LEVELS.length + " levels", 400, 200);
        c.fillText("Coins collected: " + score, 400, 238);
        c.font = "18px Arial";
        c.fillStyle = "#aaa";
        c.fillText("Press Space (or tap) to play again", 400, 290);
        c.textAlign = "left";
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loadLevel(0);
loop();
</script>
